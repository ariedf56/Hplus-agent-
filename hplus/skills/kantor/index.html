<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏢 Kantor hplus — Mission Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: #1e293b; border-bottom: 1px solid #334155; }
  header h1 { font-size: 18px; }
  header .jam { margin-left: auto; color: #94a3b8; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: #334155; color: #e2e8f0; border: 0; border-radius: 8px;
                 padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .tabs button.aktif { background: #0ea5e9; }
  main { display: flex; flex: 1; min-height: 0; }
  #panggung-wrap { flex: 1; position: relative; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  aside { width: 320px; background: #1e293b; border-left: 1px solid #334155;
          display: flex; flex-direction: column; min-height: 0; }
  .panel { padding: 10px 12px; border-bottom: 1px solid #334155; }
  .panel h3 { font-size: 13px; color: #94a3b8; margin-bottom: 8px;
              text-transform: uppercase; letter-spacing: .5px; }
  .panel input, .panel select, .panel textarea {
    width: 100%; background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 13px; }
  .panel button.aksi { background: #0ea5e9; color: #fff; border: 0; border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 13px; width: 100%; }
  .panel button.aksi:hover { background: #0284c7; }
  #chat { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex;
          flex-direction: column; gap: 8px; min-height: 0; }
  .msg { background: #0f172a; border-radius: 10px; padding: 8px 10px; font-size: 13px;
         border: 1px solid #334155; }
  .msg .dari { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
  .msg.user { border-color: #0ea5e9; }
  .kartu-butuh { background: #451a03; border: 1px solid #f59e0b; border-radius: 10px;
                 padding: 8px 10px; font-size: 13px; }
  .kartu-butuh input { margin-top: 6px; }
  .kartu-butuh button { background: #f59e0b; color: #000; border: 0;
    border-radius: 8px; padding: 6px 10px; cursor: pointer; margin-top: 4px; }
  #chat-form { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #334155; }
  #chat-form input { flex: 1; background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px; padding: 8px; }
  #chat-form button { background: #0ea5e9; color: #fff; border: 0;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  /* modal */
  #modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6);
              display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal { background: #1e293b; border: 1px solid #334155; border-radius: 14px;
           padding: 20px; width: min(480px, 92vw); max-height: 86vh; overflow-y: auto; }
  #modal h2 { margin-bottom: 4px; }
  #modal .peran { color: #94a3b8; font-size: 13px; margin-bottom: 10px; }
  #modal .tugas-aktif { background: #0f172a; border-radius: 10px; padding: 10px;
    margin: 10px 0; font-size: 13px; border: 1px solid #334155; }
  #modal .riwayat { font-size: 12px; color: #94a3b8; margin-top: 10px; }
  #modal .riwayat div { padding: 3px 0; border-bottom: 1px dashed #334155; }
  #modal .tombol { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #modal .tombol button { border: 0; border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font-size: 13px; }
  .b-tutup { background: #334155; color: #fff; }
  .b-selesai { background: #22c55e; color: #fff; }
  .b-tunda { background: #f59e0b; color: #000; }
  .b-beri { background: #0ea5e9; color: #fff; }
  .b-lulus { background: #22c55e; color: #fff; }
  .b-gagal { background: #ef4444; color: #fff; }
  #modal input { width: 100%; background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px; padding: 8px; margin-top: 6px; }
  .hint { font-size: 11px; color: #64748b; padding: 6px 16px; }
  /* browser dalam browser */
  #browser-view { position: fixed; inset: 0; background: rgba(0,0,0,.85);
    display: none; z-index: 20; flex-direction: column; padding: 12px; }
  #browser-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px;
    flex-wrap: wrap; }
  #browser-bar input { background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 8px; font-size: 13px; }
  #b-url { flex: 1; min-width: 200px; }
  #browser-bar button { border: 0; border-radius: 8px; padding: 8px 12px;
    cursor: pointer; font-size: 13px; background: #334155; color: #fff; }
  #b-selesai { background: #22c55e !important; }
  #b-tutup { background: #ef4444 !important; }
  #b-layar-wrap { flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #000; border-radius: 10px; overflow: hidden; }
  #b-layar { max-width: 100%; max-height: 100%; cursor: crosshair; }
  #b-status { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  #b-ketik { width: 220px; }
</style>
</head>
<body>
<header>
  <h1>🏢 Kantor hplus</h1>
  <div class="tabs">
    <button data-tab="kantor" class="aktif">🏢 Kantor</button>
    <button data-tab="rumah">🏠 Rumah</button>
    <button data-tab="kafe">☕ Kafe</button>
  </div>
  <div class="jam" id="jam">--:--:--</div>
</header>
<div class="hint">Klik karakter agen untuk detail &amp; aksi. Agen yang menganggur bersantai di Rumah/Kafe. <span id="live">● live</span></div>
<main>
  <div id="panggung-wrap"><canvas id="panggung" width="1200" height="620"></canvas></div>
  <aside>
    <div class="panel">
      <h3>📋 Tugas baru</h3>
      <input id="f-judul" placeholder="cth: riset harga BTC hari ini">
      <select id="f-untuk">
        <option value="">Otomatis (rute ke agen)</option>
        <option value="nara">Nara 🧭 perencana</option>
        <option value="koda">Koda 💻 coder</option>
        <option value="vera">Vera 🧪 verifikator</option>
        <option value="raka">Raka 🔍 peneliti</option>
        <option value="tara">Tara 📈 analis pasar</option>
        <option value="saka">Saka 🛡️ auditor</option>
        <option value="ari">Ari 🔑 penjaga kredensial</option>
      </select>
      <select id="f-prioritas">
        <option value="sedang">sedang</option>
        <option value="rendah">rendah</option>
        <option value="tinggi">tinggi</option>
        <option value="mendesak">mendesak</option>
      </select>
      <button class="aksi" id="b-tugas">Buat tugas</button>
    </div>
    <div class="panel"><h3>💬 Chat tim</h3></div>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Tulis perintah / pesan..." autocomplete="off">
      <button type="submit">➤</button>
    </form>
  </aside>
</main>

<div id="modal-bg"><div id="modal"></div></div>

<div id="browser-view">
  <div id="browser-bar">
    <b>🖥️ Browser Tim (bersama)</b>
    <input id="b-url" placeholder="https://...">
    <button onclick="bAksi('buka')">Buka</button>
    <input id="b-ketik" placeholder="Ketik di sini...">
    <button onclick="bAksi('ketik')">⌨️ Ketik</button>
    <button onclick="bAksi('tombol','Enter')">⏎</button>
    <button onclick="bAksi('tombol','Tab')">⇥</button>
    <button onclick="bAksi('tombol','Escape')">✕</button>
    <button id="b-selesai" onclick="bSelesai()">✅ Selesai, lanjutkan</button>
    <button id="b-tutup" onclick="tutupBrowser()">Tutup</button>
  </div>
  <div id="b-layar-wrap"><img id="b-layar" alt="memuat layar browser..."></div>
  <div id="b-status">menghubungkan...</div>
</div>

<script>
const cv = document.getElementById('panggung');
const ctx = cv.getContext('2d');
let TAB = 'kantor';
let AGEN = [];          // dari /api/status
let POS = {};           // nama -> {x,y,r} untuk klik
let CHAT_SEEN = 0;

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('aktif'));
  b.classList.add('aktif'); TAB = b.dataset.tab;
});
setInterval(() => {
  document.getElementById('jam').textContent = new Date().toLocaleTimeString('id-ID');
}, 1000);

// ---------- API ----------
async function api(path, method, body) {
  const o = { method: method || 'GET', headers: {'Content-Type': 'application/json'} };
  if (body) o.body = JSON.stringify(body);
  const r = await fetch(path, o);
  return r.json();
}
async function muatStatus() {
  try { const d = await api('/api/status'); AGEN = d.agen; } catch(e) {}
}
async function muatChat() {
  try {
    const d = await api('/api/chat');
    gambarChat(d.chat, d.butuh);
  } catch(e) {}
}

// ---------- gambar ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function teks(str, x, y, size, warna, align) {
  ctx.font = size + 'px system-ui'; ctx.fillStyle = warna || '#e2e8f0';
  ctx.textAlign = align || 'center'; ctx.fillText(str, x, y);
}

function gambarKarakter(a, x, y, t, aksi) {
  const bob = Math.sin(t/450 + x) * 4;
  POS[a.nama] = {x, y: y-40, r: 46};
  // bayangan
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(x, y+34, 34, 10, 0, 0, 7); ctx.fill();
  // badan
  ctx.fillStyle = a.warna;
  rr(x-28, y-30+bob*0.4, 56, 62, 14); ctx.fill();
  // kepala
  ctx.fillStyle = '#f2c99b';
  ctx.beginPath(); ctx.arc(x, y-52+bob*0.5, 22, 0, 7); ctx.fill();
  // mata
  const tidur = aksi === 'tidur';
  ctx.fillStyle = '#0f172a';
  if (tidur) {
    ctx.fillRect(x-12, y-56+bob*0.5, 10, 2); ctx.fillRect(x+2, y-56+bob*0.5, 10, 2);
  } else {
    ctx.beginPath(); ctx.arc(x-7, y-56+bob*0.5, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+7, y-56+bob*0.5, 3, 0, 7); ctx.fill();
  }
  // avatar emoji melayang
  ctx.font = '30px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(a.avatar, x, y-82 + Math.sin(t/600 + x)*4);
  // label nama
  teks(a.tampil, x, y+52, 13, '#cbd5e1');
  if (a.tugas && (aksi === 'kerja' || aksi === 'butuh')) {
    const j = a.tugas.judul || '';
    teks((j.length > 26 ? j.slice(0, 26) + '…' : j), x, y+68, 11, '#94a3b8');
  }
  // efek per aksi
  if (aksi === 'kerja') {
    // ketikan: titik-titik
    const n = Math.floor(t/300) % 4;
    teks('⌨️' + '.'.repeat(n), x+44, y-10, 14, '#94a3b8', 'left');
  } else if (aksi === 'butuh') {
    teks('🙋', x+40, y-70 + Math.sin(t/400)*5, 26, '#fff');
  } else if (aksi === 'tidur') {
    const n = Math.floor(t/800) % 3;
    teks('💤'.repeat(n+1), x+34, y-80 - (t/40 % 20), 18, '#fff', 'left');
  } else if (aksi === 'makan') {
    teks('🍔☕', x, y-88 + Math.sin(t/500)*4, 22, '#fff');
  } else if (aksi === 'ngobrol') {
    if (Math.floor(t/1200) % 2 === 0) teks('💬', x+38, y-72, 22, '#fff');
  }
}

function meja(x, y) {
  ctx.fillStyle = '#8b5a2b'; rr(x-70, y, 140, 14, 5); ctx.fill();
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(x-62, y+14, 10, 40); ctx.fillRect(x+52, y+14, 10, 40);
  // monitor
  ctx.fillStyle = '#1e293b'; rr(x-24, y-46, 48, 36, 4); ctx.fill();
  ctx.fillStyle = '#0ea5e9'; rr(x-20, y-42, 40, 28, 3); ctx.fill();
  ctx.fillStyle = '#334155'; ctx.fillRect(x-4, y-10, 8, 10);
}
function tempatTidur(x, y) {
  ctx.fillStyle = '#7c3aed'; rr(x-70, y-6, 140, 26, 8); ctx.fill();
  ctx.fillStyle = '#a78bfa'; rr(x-70, y-22, 44, 20, 8); ctx.fill(); // bantal
  ctx.fillStyle = '#5b21b6'; ctx.fillRect(x-70, y+20, 10, 26); ctx.fillRect(x+60, y+20, 10, 26);
}
function mejaKafe(x, y) {
  ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(x, y, 46, 0, 7); ctx.fill();
  ctx.fillStyle = '#92400e'; ctx.fillRect(x-6, y, 12, 44);
  teks('☕', x-18, y-8, 20, '#fff'); teks('🍰', x+18, y-8, 20, '#fff');
}

function latar(t) {
  const W = 1200, H = 620;
  if (TAB === 'kantor') {
    ctx.fillStyle = '#1e3a5f'; ctx.fillRect(0, 0, W, 400);       // dinding
    ctx.fillStyle = '#2c4a73'; ctx.fillRect(0, 400, W, 220);      // lantai
    teks('🏢 KANTOR HERMES', W/2, 60, 30, '#7dd3fc');
    // jendela
    ctx.fillStyle = '#0ea5e9';
    for (let i = 0; i < 4; i++) { rr(80 + i*290, 110, 180, 120, 8); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    for (let i = 0; i < 4; i++) { rr(90 + i*290, 120, 70, 100, 6); ctx.fill(); }
  } else if (TAB === 'rumah') {
    ctx.fillStyle = '#3b2f4a'; ctx.fillRect(0, 0, W, 400);
    ctx.fillStyle = '#2d2440'; ctx.fillRect(0, 400, W, 220);
    teks('🏠 RUMAH — agen beristirahat', W/2, 60, 28, '#c4b5fd');
    teks('🌙', 1050, 120, 60, '#fff');
  } else {
    ctx.fillStyle = '#4a2f1d'; ctx.fillRect(0, 0, W, 400);
    ctx.fillStyle = '#3a2415'; ctx.fillRect(0, 400, W, 220);
    teks('☕ KAFE — santai & ngobrol', W/2, 60, 28, '#fdba74');
  }
}

function render(t) {
  ctx.clearRect(0, 0, 1200, 620);
  POS = {};
  latar(t);
  const diKantor = AGEN.filter(a => a.state === 'kerja' || a.state === 'butuh');
  const diRumah  = AGEN.filter(a => a.state === 'tidur');
  const diKafe   = AGEN.filter(a => a.state === 'makan' || a.state === 'ngobrol');
  if (TAB === 'kantor') {
    diKantor.forEach((a, i) => {
      const x = 1200/(diKantor.length+1) * (i+1);
      meja(x, 470);
      gambarKarakter(a, x, 430, t, a.state);
    });
    if (!diKantor.length) teks('Semua agen sedang bersantai 🏖️ — cek Rumah / Kafe', 600, 330, 22, '#94a3b8');
  } else if (TAB === 'rumah') {
    diRumah.forEach((a, i) => {
      const x = 1200/(diRumah.length+1) * (i+1);
      tempatTidur(x, 430);
      gambarKarakter(a, x-30, 430, t, 'tidur');
    });
    if (!diRumah.length) teks('Tidak ada yang tidur saat ini 😴', 600, 330, 22, '#94a3b8');
  } else {
    diKafe.forEach((a, i) => {
      const x = 1200/(diKafe.length+1) * (i+1);
      mejaKafe(x, 440);
      gambarKarakter(a, x + (a.state === 'ngobrol' && i % 2 ? 52 : -52), 400, t, a.state);
    });
    if (!diKafe.length) teks('Kafe sepi ☕', 600, 330, 22, '#94a3b8');
  }
  requestAnimationFrame(render);
}

// ---------- klik agen → modal ----------
cv.addEventListener('click', async (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (1200 / r.width);
  const y = (e.clientY - r.top) * (620 / r.height);
  for (const nama in POS) {
    const p = POS[nama];
    if ((x-p.x)**2 + (y-p.y)**2 < p.r*p.r) { bukaModal(nama); return; }
  }
});

async function bukaModal(nama) {
  const d = await api('/api/agen/' + nama);
  const m = document.getElementById('modal');
  const st = {kerja:'🔨 kerja', butuh:'🙋 butuh bantuan', tidur:'😴 tidur',
              makan:'🍔 makan', ngobrol:'💬 ngobrol'}[d.state] || d.state;
  let h = `<h2>${d.info.tampil}</h2><div class="peran">${d.info.peran} · status: ${st}</div>`;
  const jalan = d.tugas.find(t => t.status === 'jalan');
  if (jalan) {
    h += `<div class="tugas-aktif">📌 <b>${jalan.judul}</b> [${jalan.prioritas}]<br>
          ${jalan.detail ? '📝 ' + jalan.detail.slice(0, 200) : ''}</div>`;
    if (jalan.minta_bantuan)
      h += `<div class="kartu-butuh">🙋 Minta ke <b>${jalan.minta_bantuan.ke}</b>:
            ${jalan.minta_bantuan.pesan}<br>
            <input id="m-beri" placeholder="Tulis bantuan/jawaban...">
            <button onclick="aksiModal('${jalan.id}','beri')">Kirim bantuan</button></div>`;
    h += `<div class="tombol">
      <button class="b-selesai" onclick="aksiModal('${jalan.id}','selesai')">✅ Selesai</button>
      <button class="b-tunda" onclick="aksiModal('${jalan.id}','tunda')">⏳ Tunda</button></div>`;
  } else h += `<div class="tugas-aktif">💤 Tidak ada tugas berjalan.</div>`;
  const selesai = d.tugas.filter(t => t.status === 'selesai').slice(-3).reverse();
  if (selesai.length) {
    h += `<div class="riwayat"><b>Audit tugas terakhir:</b>`;
    selesai.forEach(t => {
      const a = (t.audit || []).map(x => `${x.vonis === 'lulus' ? '✅' : '❌'} ${x.vonis}`).join(', ');
      h += `<div>${t.id} ${t.judul.slice(0, 40)} ${a ? '· ' + a : '· ⏳ belum diaudit'}
        <button class="b-lulus" onclick="auditModal('${t.id}','lulus')">Lulus</button>
        <button class="b-gagal" onclick="auditModal('${t.id}','gagal')">Gagal</button></div>`;
    });
    h += `</div>`;
  }
  const riw = d.tugas.slice(-5).reverse();
  h += `<div class="riwayat"><b>Riwayat tugas:</b>` +
       riw.map(t => `<div>${t.id} [${t.status}] ${t.judul.slice(0, 45)}</div>`).join('') + `</div>`;
  h += `<div class="riwayat"><b>Skill aktif (${d.skill.filter(s => s.status === 'aktif').length}):</b> ` +
       d.skill.filter(s => s.status === 'aktif').slice(0, 8).map(s => s.nama).join(', ') + `</div>`;
  h += `<div class="tombol"><button class="b-beri" onclick="bukaBrowser()">🖥️ Buka browser tim</button>`;
  h += `<button class="b-tutup" onclick="tutupModal()">Tutup</button></div>`;
  m.innerHTML = h;
  document.getElementById('modal-bg').style.display = 'flex';
}
function tutupModal() { document.getElementById('modal-bg').style.display = 'none'; }
document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target.id === 'modal-bg') tutupModal();
});
async function aksiModal(id, aksi) {
  const body = { aksi, id };
  if (aksi === 'beri') {
    const v = document.getElementById('m-beri').value.trim();
    if (!v) return alert('Tulis bantuannya dulu.');
    body.isi = v;
  }
  if (aksi === 'selesai') {
    const v = prompt('Ringkasan hasil:'); if (v === null) return;
    body.hasil = v;
  }
  if (aksi === 'tunda') {
    const v = prompt('Alasan penundaan:'); if (v === null) return;
    body.alasan = v;
  }
  await api('/api/aksi', 'POST', body);
  tutupModal(); muatStatus();
}
async function auditModal(id, vonis) {
  const c = vonis === 'gagal' ? prompt('Catatan perbaikan wajib:') : prompt('Catatan (opsional):');
  if (c === null) return;
  await api('/api/aksi', 'POST', { aksi: 'audit', id, vonis, catatan: c });
  tutupModal(); muatStatus();
}

// ---------- chat ----------
function gambarChat(log, butuh) {
  const el = document.getElementById('chat');
  let h = '';
  (butuh || []).forEach(b => {
    h += `<div class="kartu-butuh">🙋 <b>${b.untuk}</b> butuh bantuanmu:<br>${b.pesan}
      <input id="butuh-${b.id}" placeholder="Tulis jawaban (OTP/kode)...">
      <button onclick="jawabButuh('${b.id}')">Kirim</button>
      <button onclick="bukaBrowser('${b.id}')">🖥️ Kerjakan langsung di browser</button></div>`;
  });
  (log || []).forEach(m => {
    h += `<div class="msg ${m.dari === 'user' ? 'user' : ''}">
          <div class="dari">${m.dari === 'user' ? '🧑 Kamu' : '🤖 Komandan'} · ${m.pada || ''}</div>
          ${m.teks}</div>`;
  });
  el.innerHTML = h;
  el.scrollTop = el.scrollHeight;
}
async function jawabButuh(id) {
  const v = document.getElementById('butuh-' + id).value.trim();
  if (!v) return alert('Tulis jawabannya dulu.');
  await api('/api/aksi', 'POST', { aksi: 'beri', id, isi: v });
  muatChat(); muatStatus();
}
document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const inp = document.getElementById('chat-input');
  const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  await api('/api/chat', 'POST', { teks: v });
  muatChat(); muatStatus();
});

// ---------- tugas baru ----------
document.getElementById('b-tugas').addEventListener('click', async () => {
  const judul = document.getElementById('f-judul').value.trim();
  if (!judul) return alert('Tulis judul tugas dulu.');
  const body = { judul, prioritas: document.getElementById('f-prioritas').value };
  const u = document.getElementById('f-untuk').value;
  if (u) body.untuk = u;
  const d = await api('/api/tugas', 'POST', body);
  document.getElementById('f-judul').value = '';
  alert(d.ok ? `Tugas dibuat untuk ${d.untuk} ✅` : ('Gagal: ' + (d.error || d.keluaran)));
  muatStatus();
});

// ---------- browser dalam browser (milik TIM, semua agen) ----------
let B_TIMER = null;
let B_TUGAS_ID = null;   // id tugas butuh yang sedang dibantu
async function bukaBrowser(taskId) {
  B_TUGAS_ID = taskId || null;
  document.getElementById('browser-view').style.display = 'flex';
  tutupModal();
  await bStatus();
  const img = document.getElementById('b-layar');
  const segarkan = () => { img.src = '/api/browser/layar?t=' + Date.now(); };
  segarkan();
  clearInterval(B_TIMER);
  B_TIMER = setInterval(segarkan, 1500);
  bStatus();
}
function tutupBrowser() {
  clearInterval(B_TIMER);
  document.getElementById('browser-view').style.display = 'none';
}
async function bStatus() {
  try {
    const d = await api('/api/browser/status');
    document.getElementById('b-status').textContent =
      d.url ? ('🌐 ' + d.url) : 'browser siap';
    if (d.url) document.getElementById('b-url').value = d.url;
  } catch(e) {
    document.getElementById('b-status').textContent = '⚠️ ' + (e.message || 'gagal');
  }
}
async function bAksi(aksi, arg) {
  const body = { aksi };
  if (aksi === 'buka') {
    const u = document.getElementById('b-url').value.trim();
    if (!u) return alert('Tulis URL dulu.');
    body.url = u;
  } else if (aksi === 'ketik') {
    const v = document.getElementById('b-ketik').value;
    if (!v) return alert('Tulis teks dulu.');
    body.teks = v;
    document.getElementById('b-ketik').value = '';
  } else if (aksi === 'tombol') {
    body.tombol = arg;
  }
  const d = await api('/api/browser/aksi', 'POST', body);
  if (d.error) alert(d.error);
  bStatus();
}
document.getElementById('b-layar').addEventListener('click', async (e) => {
  const img = e.target;
  const r = img.getBoundingClientRect();
  // koordinat natural vs tampil: pakai fraksi agar skala aman
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top) / r.height;
  await api('/api/browser/aksi', 'POST', { aksi: 'klik_xy', x, y });
});
async function bSelesai() {
  // beri jawaban pada tugas butuh yang sedang dibantu (agen mana pun)
  let bid = B_TUGAS_ID;
  if (!bid) {
    const d = await api('/api/chat');
    const b = (d.butuh || [])[0];
    bid = b ? b.id : null;
  }
  if (!bid) { tutupBrowser(); return; }
  const v = prompt('Catatan untuk agen (mis. "OTP sudah diisi, lanjutkan"):');
  if (v === null) return;
  await api('/api/aksi', 'POST', { aksi: 'beri', id: bid, isi: v || 'selesai via browser' });
  B_TUGAS_ID = null;
  tutupBrowser(); muatChat(); muatStatus();
}

// ---------- loop ----------
muatStatus(); muatChat();
setInterval(muatStatus, 3000);
setInterval(muatChat, 3000);
requestAnimationFrame(render);
</script>
