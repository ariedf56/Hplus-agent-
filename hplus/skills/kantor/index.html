<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🏢 Kantor hplus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b1220; --card: #141d33; --card2: #1a2540; --line: #263453;
    --txt: #eaf0fd; --mut: #8ea1c7; --acc: #38bdf8;
    --kerja: #22c55e; --butuh: #f59e0b; --tidur: #64748b;
    --makan: #fb923c; --ngobrol: #c084fc;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--txt);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
  }
  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: rgba(13,20,38,.92);
    border-bottom: 1px solid var(--line); z-index: 5;
    backdrop-filter: blur(8px);
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 11px;
          color: var(--mut); font-weight: 600; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--kerja);
            animation: pulse-dot 1.6s ease-out infinite; }
  @keyframes pulse-dot { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)} 70%{box-shadow:0 0 0 7px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
  .jam { margin-left: auto; font-size: 12px; color: var(--mut);
         font-variant-numeric: tabular-nums; }
  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 8px; padding: 10px 14px 4px; overflow-x: auto;
          scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 1 0 auto; border: 1px solid var(--line); background: var(--card);
    color: var(--mut); border-radius: 12px; padding: 9px 14px; font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .tabs button.aktif { background: var(--acc); border-color: var(--acc); color: #04121f; }
  .ringkasan { padding: 6px 16px 2px; font-size: 12px; color: var(--mut); }
  .ringkasan b { color: var(--txt); }
  /* ---------- stage ---------- */
  #stage { flex: 1; min-height: 0; overflow-y: auto; position: relative;
           padding: 12px 14px 90px; transition: background .4s; }
  #stage.kantor { background:
      radial-gradient(600px 200px at 20% -40px, rgba(56,189,248,.14), transparent 60%),
      radial-gradient(500px 180px at 85% -30px, rgba(56,189,248,.10), transparent 60%),
      linear-gradient(180deg, #0e2a4d 0%, #0b1220 55%); }
  #stage.rumah { background:
      radial-gradient(300px 300px at 85% 10%, rgba(196,181,253,.16), transparent 60%),
      radial-gradient(2px 2px at 12% 22%, #fff, transparent),
      radial-gradient(2px 2px at 32% 12%, #fff, transparent),
      radial-gradient(2px 2px at 58% 28%, #fff, transparent),
      radial-gradient(2px 2px at 76% 18%, #fff, transparent),
      linear-gradient(180deg, #241a45 0%, #0b1220 60%); }
  #stage.kafe { background:
      radial-gradient(500px 220px at 50% -40px, rgba(251,146,60,.16), transparent 60%),
      linear-gradient(180deg, #43280f 0%, #0b1220 60%); }
  .scene-judul { font-size: 15px; font-weight: 700; margin: 2px 2px 12px;
                 display: flex; align-items: center; gap: 8px; }
  .scene-judul small { font-weight: 400; color: var(--mut); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 12px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
  /* ---------- kartu agen ---------- */
  .agen {
    position: relative; border: 1px solid var(--line); border-radius: 18px;
    background: linear-gradient(180deg, var(--card2), var(--card));
    padding: 16px 10px 12px; cursor: pointer; color: var(--txt);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .15s, border-color .3s, box-shadow .3s;
    font-family: inherit; width: 100%; text-align: center;
  }
  .agen:active { transform: scale(.97); }
  .agen.flash { animation: flash .9s; }
  @keyframes flash { 0%{box-shadow:0 0 0 3px var(--sc,#38bdf8)} 100%{box-shadow:0 0 0 0 transparent} }
  .a-avatar { position: relative; width: 64px; height: 64px; margin-bottom: 6px; }
  .a-avatar .emo {
    width: 64px; height: 64px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 30px;
    background: color-mix(in srgb, var(--w) 18%, #0b1220);
    border: 2px solid var(--w);
  }
  .a-avatar .ring {
    position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid transparent; pointer-events: none;
  }
  .st-kerja .a-avatar .ring { border-color: var(--kerja); animation: ring-soft 2s ease-out infinite; }
  .st-butuh .a-avatar .ring { border-color: var(--butuh); animation: ring-hard 1s ease-out infinite; }
  .st-tidur { opacity: .75; }
  @keyframes ring-soft { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)} 70%{box-shadow:0 0 0 8px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
  @keyframes ring-hard { 0%{box-shadow:0 0 0 0 rgba(245,158,11,.6)} 70%{box-shadow:0 0 0 10px rgba(245,158,11,0)} 100%{box-shadow:0 0 0 0 rgba(245,158,11,0)} }
  .st-kerja .a-avatar .emo { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .a-badge {
    position: absolute; right: -6px; bottom: -2px; font-size: 20px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .st-kerja .a-badge::after { content: ''; }
  .st-butuh .a-badge { animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .st-tidur .a-badge { animation: zzz 3s ease-in-out infinite; }
  @keyframes zzz { 0%{transform:translateY(0);opacity:.9} 50%{transform:translateY(-6px);opacity:.4} 100%{transform:translateY(0);opacity:.9} }
  .st-ngobrol .a-badge { animation: pop 1.4s ease-in-out infinite; }
  @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  .a-nama { font-size: 14px; font-weight: 700; }
  .a-peran { font-size: 11px; color: var(--mut); }
  .a-status { font-size: 11px; font-weight: 700; margin-top: 4px;
              padding: 3px 10px; border-radius: 20px; background: var(--sc-bg);
              color: var(--sc); }
  .st-kerja  { --sc: var(--kerja);  --sc-bg: rgba(34,197,94,.14); }
  .st-butuh  { --sc: var(--butuh);  --sc-bg: rgba(245,158,11,.16); }
  .st-tidur  { --sc: var(--tidur);  --sc-bg: rgba(100,116,139,.16); }
  .st-makan  { --sc: var(--makan);  --sc-bg: rgba(251,146,60,.14); }
  .st-ngobrol{ --sc: var(--ngobrol); --sc-bg: rgba(192,132,252,.14); }
  .a-tugas { font-size: 11px; color: var(--mut); margin-top: 6px; line-height: 1.35;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; }
  .ketik::after { content: ''; animation: dots 1.2s steps(4) infinite; color: var(--kerja); font-weight: 700; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  .kosong { text-align: center; color: var(--mut); padding: 48px 20px; font-size: 14px; }
  .kosong .big { font-size: 44px; display: block; margin-bottom: 10px; }
  /* ---------- FAB ---------- */
  #fab {
    position: fixed; right: 16px; bottom: 76px; width: 56px; height: 56px;
    border-radius: 50%; border: 0; background: var(--acc); color: #04121f;
    font-size: 26px; font-weight: 700; cursor: pointer; z-index: 6;
    box-shadow: 0 6px 20px rgba(56,189,248,.4); transition: transform .15s;
  }
  #fab:active { transform: scale(.92); }
  /* ---------- chat bar + sheet ---------- */
  #chatbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(13,20,38,.96); border-top: 1px solid var(--line);
    cursor: pointer; backdrop-filter: blur(8px); font-size: 14px; font-weight: 600;
  }
  #chatbar .cbadge {
    margin-left: auto; background: var(--butuh); color: #000; font-size: 11px;
    font-weight: 700; border-radius: 20px; padding: 3px 10px; display: none;
    animation: bounce 1s ease-in-out infinite;
  }
  #chatbar.ada-butuh { border-top-color: var(--butuh); }
  #chatbar.ada-butuh .cbadge { display: block; }
  #chatsheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; height: 72dvh;
    background: var(--bg); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; transform: translateY(102%);
    transition: transform .28s cubic-bezier(.32,.72,.35,1);
    display: flex; flex-direction: column; box-shadow: 0 -12px 40px rgba(0,0,0,.5);
  }
  #chatsheet.buka { transform: none; }
  .sheet-handle { padding: 10px; cursor: pointer; text-align: center; }
  .sheet-handle i { display: block; width: 44px; height: 5px; border-radius: 3px;
                    background: var(--line); margin: 0 auto; }
  .sheet-judul { padding: 0 16px 8px; font-size: 15px; font-weight: 700;
                 display: flex; align-items: center; gap: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 4px 16px 12px; display: flex;
          flex-direction: column; gap: 8px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 9px 12px; font-size: 13.5px; line-height: 1.45;
         animation: masuk .25s ease-out; max-width: 92%; }
  @keyframes masuk { from{opacity:0; transform:translateY(6px)} to{opacity:1} }
  .msg .dari { font-size: 11px; color: var(--mut); margin-bottom: 3px; font-weight: 600; }
  .msg.user { align-self: flex-end; border-color: var(--acc); background: #0e2a44; }
  .kartu-butuh { background: #2b1a05; border: 1px solid var(--butuh); border-radius: 12px;
                 padding: 10px 12px; font-size: 13px; animation: masuk .25s; }
  .kartu-butuh input { width: 100%; margin-top: 8px; background: var(--bg); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px; font-size: 13px; }
  .kartu-butuh .row { display: flex; gap: 6px; margin-top: 8px; }
  .kartu-butuh button { flex: 1; border: 0; border-radius: 8px; padding: 9px;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .kb-kirim { background: var(--butuh); color: #000; }
  .kb-browser { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
  #chat-form { display: flex; gap: 8px; padding: 10px 16px;
               padding-bottom: calc(14px + env(safe-area-inset-bottom));
               border-top: 1px solid var(--line); }
  #chat-form input { flex: 1; background: var(--card); color: var(--txt);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px; font-size: 14px; }
  #chat-form button { background: var(--acc); color: #04121f; border: 0;
    border-radius: 12px; padding: 0 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
  /* ---------- sheet umum (tugas & modal agen) ---------- */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    background: var(--bg); border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0; transform: translateY(102%);
    transition: transform .28s cubic-bezier(.32,.72,.35,1);
    max-height: 82dvh; display: flex; flex-direction: column;
    box-shadow: 0 -12px 40px rgba(0,0,0,.5);
  }
  .sheet.buka { transform: none; }
  .sheet-body { overflow-y: auto; padding: 4px 18px 24px; }
  .sheet-body h2 { font-size: 18px; margin-bottom: 2px; }
  .sheet-body .peran { color: var(--mut); font-size: 13px; margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--mut); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--card); color: var(--txt);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px; font-size: 14px; }
  .btn-utama { width: 100%; background: var(--acc); color: #04121f; border: 0;
    border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .tugas-aktif { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin: 10px 0; font-size: 13.5px; line-height: 1.5; }
  .riwayat { font-size: 12.5px; color: var(--mut); margin-top: 12px; }
  .riwayat b { color: var(--txt); }
  .riwayat .ritem { padding: 7px 0; border-bottom: 1px dashed var(--line);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .riwayat .ritem span { flex: 1; min-width: 140px; }
  .tombol { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tombol button { border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    font-size: 13.5px; font-weight: 700; }
  .b-tutup { background: var(--card2); color: var(--txt); }
  .b-selesai, .b-lulus { background: var(--kerja); color: #04140a; }
  .b-tunda { background: var(--butuh); color: #000; }
  .b-beri { background: var(--acc); color: #04121f; }
  .b-gagal { background: #ef4444; color: #fff; }
  .mini { padding: 6px 10px !important; font-size: 12px !important; }
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 7;
           display: none; }
  #scrim.nyala { display: block; }
  /* ---------- browser ---------- */
  #browser-view { position: fixed; inset: 0; background: rgba(4,8,18,.97);
    display: none; z-index: 30; flex-direction: column; padding: 10px; }
  #browser-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  #browser-bar b { font-size: 13px; }
  #browser-bar input { background: var(--card); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px; font-size: 13px; }
  #b-url { flex: 1; min-width: 140px; }
  #browser-bar button { border: 0; border-radius: 8px; padding: 9px 11px; cursor: pointer;
    font-size: 13px; background: var(--card2); color: #fff; font-weight: 600; }
  #b-selesai { background: var(--kerja) !important; color: #04140a !important; }
  #b-tutup { background: #ef4444 !important; }
  #b-layar-wrap { flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #000; border-radius: 12px; overflow: hidden; }
  #b-layar { max-width: 100%; max-height: 100%; cursor: crosshair; }
  #b-status { font-size: 12px; color: var(--mut); margin-top: 6px; }
  #b-ketik { width: 150px; }
</style>
</head>
<body>
<header>
  <h1>🏢 Kantor hplus</h1>
  <span class="live"><i></i>LIVE</span>
  <span class="jam" id="jam">--:--:--</span>
</header>
<div class="tabs" id="tabs">
  <button data-tab="kantor" class="aktif">🏢 Kantor</button>
  <button data-tab="rumah">🏠 Rumah</button>
  <button data-tab="kafe">☕ Kafe</button>
</div>
<div class="ringkasan" id="ringkasan"></div>

<main id="stage" class="kantor"></main>

<button id="fab" title="Tugas baru">＋</button>

<div id="chatbar">
  <span>💬</span><span>Chat tim</span>
  <span class="cbadge" id="cbadge">0 butuh bantuan</span>
  <span style="color:var(--mut)">⌃</span>
</div>

<div id="chatsheet">
  <div class="sheet-handle" id="chat-handle"><i></i></div>
  <div class="sheet-judul">💬 Chat tim</div>
  <div id="chat"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="Tulis perintah / pesan..." autocomplete="off">
    <button type="submit">➤</button>
  </form>
</div>

<div id="scrim"></div>

<div class="sheet" id="tugas-sheet">
  <div class="sheet-handle" data-tutup="tugas-sheet"><i></i></div>
  <div class="sheet-body">
    <h2>📋 Tugas baru</h2>
    <div class="peran">Buat tugas untuk tim — atau biarkan rute otomatis yang memilih agen.</div>
    <div class="field"><label>Judul tugas</label>
      <input id="f-judul" placeholder="cth: riset harga BTC hari ini"></div>
    <div class="field"><label>Agen</label>
      <select id="f-untuk">
        <option value="">Otomatis (rute ke agen)</option>
        <option value="nara">Nara 🧭 — perencana</option>
        <option value="koda">Koda 💻 — coder</option>
        <option value="vera">Vera 🧪 — verifikator</option>
        <option value="raka">Raka 🔍 — peneliti</option>
        <option value="tara">Tara 📈 — analis pasar</option>
        <option value="saka">Saka 🛡️ — auditor</option>
        <option value="ari">Ari 🔑 — penjaga kredensial</option>
      </select></div>
    <div class="field"><label>Prioritas</label>
      <select id="f-prioritas">
        <option value="sedang">sedang</option>
        <option value="rendah">rendah</option>
        <option value="tinggi">tinggi</option>
        <option value="mendesak">mendesak</option>
      </select></div>
    <button class="btn-utama" id="b-tugas">Buat tugas</button>
  </div>
</div>

<div class="sheet" id="agen-sheet">
  <div class="sheet-handle" data-tutup="agen-sheet"><i></i></div>
  <div class="sheet-body" id="agen-body"></div>
</div>

<div id="browser-view">
  <div id="browser-bar">
    <b>🖥️ Browser Tim</b>
    <input id="b-url" placeholder="https://...">
    <button onclick="bAksi('buka')">Buka</button>
    <input id="b-ketik" placeholder="Ketik...">
    <button onclick="bAksi('ketik')">⌨️</button>
    <button onclick="bAksi('tombol','Enter')">⏎</button>
    <button onclick="bAksi('tombol','Tab')">⇥</button>
    <button onclick="bAksi('tombol','Escape')">✕</button>
    <button id="b-selesai" onclick="bSelesai()">✅ Selesai</button>
    <button id="b-tutup" onclick="tutupBrowser()">Tutup</button>
  </div>
  <div id="b-layar-wrap"><img id="b-layar" alt="memuat layar browser..."></div>
  <div id="b-status">menghubungkan...</div>
</div>

<script>
let TAB = 'kantor';
let AGEN = [];
let STATE_LAMA = {};
let BUTUH_N = 0;

const ST_TXT = { kerja: '🔨 kerja', butuh: '🙋 butuh bantuan', tidur: '😴 tidur',
                 makan: '🍔 makan', ngobrol: '💬 ngobrol' };
const ST_BADGE = { kerja: '⌨️', butuh: '🙋', tidur: '💤', makan: '☕', ngobrol: '💬' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('aktif'));
  b.classList.add('aktif'); TAB = b.dataset.tab;
  document.getElementById('stage').className = TAB;
  gambar();
});
setInterval(() => {
  document.getElementById('jam').textContent = new Date().toLocaleTimeString('id-ID');
}, 1000);

async function api(path, method, body) {
  const o = { method: method || 'GET', headers: {'Content-Type': 'application/json'} };
  if (body) o.body = JSON.stringify(body);
  const r = await fetch(path, o);
  return r.json();
}

/* ---------- stage ---------- */
function kartu(a) {
  const flash = STATE_LAMA[a.nama] && STATE_LAMA[a.nama] !== a.state ? ' flash' : '';
  STATE_LAMA[a.nama] = a.state;
  const tugas = a.tugas ? `<div class="a-tugas">${esc(a.tugas.judul)}</div>` : '';
  const ketik = a.state === 'kerja' ? '<span class="ketik"></span>' : '';
  return `<button class="agen st-${a.state}${flash}" style="--w:${a.warna}" data-nama="${a.nama}">
    <span class="a-avatar"><span class="emo">${a.avatar}<i class="ring"></i></span>
      <span class="a-badge">${ST_BADGE[a.state] || '💤'}</span></span>
    <span class="a-nama">${esc(a.tampil)}</span>
    <span class="a-peran">${esc(a.peran)}</span>
    <span class="a-status">${ST_TXT[a.state] || a.state}${ketik}</span>
    ${tugas}</button>`;
}
function gambar() {
  const st = document.getElementById('stage');
  const diKantor = AGEN.filter(a => a.state === 'kerja' || a.state === 'butuh');
  const diRumah  = AGEN.filter(a => a.state === 'tidur');
  const diKafe   = AGEN.filter(a => a.state === 'makan' || a.state === 'ngobrol');
  const k = diKantor.length, t = diRumah.length, f = diKafe.length;
  document.getElementById('ringkasan').innerHTML =
    `<b>${k}</b> kerja · <b>${diKantor.filter(a=>a.state==='butuh').length}</b> butuh bantuan · <b>${t+f}</b> santai`;
  const JUDUL = { kantor: ['🏢 Kantor', 'ruang kerja tim'],
                  rumah: ['🏠 Rumah', 'agen beristirahat'],
                  kafe: ['☕ Kafe', 'santai & ngobrol'] };
  const KOSONG = { kantor: ['🪑', 'Semua agen sedang bersantai — cek Rumah / Kafe'],
                   rumah: ['😴', 'Tidak ada yang tidur saat ini'],
                   kafe: ['☕', 'Kafe sepi'] };
  let daftar;
  if (TAB === 'kantor') daftar = diKantor;
  else if (TAB === 'rumah') daftar = diRumah;
  else daftar = diKafe;
  let h = `<div class="scene-judul">${JUDUL[TAB][0]} <small>${JUDUL[TAB][1]}</small></div>`;
  h += daftar.length
    ? `<div class="grid">${daftar.map(kartu).join('')}</div>`
    : `<div class="kosong"><span class="big">${KOSONG[TAB][0]}</span>${KOSONG[TAB][1]}</div>`;
  st.innerHTML = h;
  st.querySelectorAll('.agen').forEach(el => el.onclick = () => bukaModal(el.dataset.nama));
}
async function muatStatus() {
  try { const d = await api('/api/status'); AGEN = d.agen || []; gambar(); }
  catch(e) {}
}

/* ---------- sheets ---------- */
const scrim = document.getElementById('scrim');
function bukaSheet(id) {
  document.getElementById(id).classList.add('buka');
  scrim.classList.add('nyala');
}
function tutupSheets() {
  document.querySelectorAll('.sheet.buka, #chatsheet.buka').forEach(s => s.classList.remove('buka'));
  scrim.classList.remove('nyala');
}
scrim.onclick = tutupSheets;
document.querySelectorAll('[data-tutup]').forEach(h =>
  h.onclick = () => tutupSheets());
document.getElementById('fab').onclick = () => bukaSheet('tugas-sheet');
document.getElementById('chatbar').onclick = () => bukaSheet('chatsheet');
document.getElementById('chat-handle').onclick = () => tutupSheets();

/* ---------- modal agen ---------- */
async function bukaModal(nama) {
  const d = await api('/api/agen/' + nama);
  const m = document.getElementById('agen-body');
  let h = `<h2>${esc(d.info.tampil)}</h2>
    <div class="peran">${esc(d.info.peran)} · status: ${ST_TXT[d.state] || d.state}</div>`;
  const jalan = (d.tugas || []).find(t => t.status === 'jalan');
  if (jalan) {
    h += `<div class="tugas-aktif">📌 <b>${esc(jalan.judul)}</b> [${esc(jalan.prioritas)}]<br>
          ${jalan.detail ? '📝 ' + esc(jalan.detail.slice(0, 200)) : ''}</div>`;
    if (jalan.minta_bantuan)
      h += `<div class="kartu-butuh">🙋 Minta ke <b>${esc(jalan.minta_bantuan.ke)}</b>:
            ${esc(jalan.minta_bantuan.pesan)}<br>
            <input id="m-beri" placeholder="Tulis bantuan/jawaban...">
            <div class="row"><button class="kb-kirim" onclick="aksiModal('${jalan.id}','beri')">Kirim bantuan</button></div></div>`;
    h += `<div class="tombol">
      <button class="b-selesai" onclick="aksiModal('${jalan.id}','selesai')">✅ Selesai</button>
      <button class="b-tunda" onclick="aksiModal('${jalan.id}','tunda')">⏳ Tunda</button></div>`;
  } else h += `<div class="tugas-aktif">💤 Tidak ada tugas berjalan.</div>`;
  const selesai = (d.tugas || []).filter(t => t.status === 'selesai').slice(-3).reverse();
  if (selesai.length) {
    h += `<div class="riwayat"><b>Audit tugas terakhir:</b>`;
    selesai.forEach(t => {
      const a = (t.audit || []).map(x => `${x.vonis === 'lulus' ? '✅' : '❌'} ${x.vonis}`).join(', ');
      h += `<div class="ritem"><span>${t.id} ${esc(t.judul.slice(0, 40))} ${a ? '· ' + a : '· ⏳ belum diaudit'}</span>
        <button class="b-lulus mini" onclick="auditModal('${t.id}','lulus')">Lulus</button>
        <button class="b-gagal mini" onclick="auditModal('${t.id}','gagal')">Gagal</button></div>`;
    });
    h += `</div>`;
  }
  const riw = (d.tugas || []).slice(-5).reverse();
  h += `<div class="riwayat"><b>Riwayat tugas:</b>` +
       riw.map(t => `<div class="ritem"><span>${t.id} [${t.status}] ${esc(t.judul.slice(0, 45))}</span></div>`).join('') + `</div>`;
  const aktif = (d.skill || []).filter(s => s.status === 'aktif');
  h += `<div class="riwayat"><b>Skill aktif (${aktif.length}):</b> ` +
       esc(aktif.slice(0, 8).map(s => s.nama).join(', ')) + `</div>`;
  h += `<div class="tombol"><button class="b-beri" onclick="bukaBrowser()">🖥️ Buka browser tim</button>
        <button class="b-tutup" onclick="tutupSheets()">Tutup</button></div>`;
  m.innerHTML = h;
  bukaSheet('agen-sheet');
}
async function aksiModal(id, aksi) {
  const body = { aksi, id };
  if (aksi === 'beri') {
    const v = document.getElementById('m-beri').value.trim();
    if (!v) return alert('Tulis bantuannya dulu.');
    body.isi = v;
  }
  if (aksi === 'selesai') {
    const v = prompt('Ringkasan hasil:'); if (v === null) return;
    body.hasil = v;
  }
  if (aksi === 'tunda') {
    const v = prompt('Alasan penundaan:'); if (v === null) return;
    body.alasan = v;
  }
  await api('/api/aksi', 'POST', body);
  tutupSheets(); muatStatus();
}
async function auditModal(id, vonis) {
  const c = vonis === 'gagal' ? prompt('Catatan perbaikan wajib:') : prompt('Catatan (opsional):');
  if (c === null) return;
  await api('/api/aksi', 'POST', { aksi: 'audit', id, vonis, catatan: c });
  tutupSheets(); muatStatus();
}

/* ---------- chat ---------- */
function gambarChat(log, butuh) {
  const el = document.getElementById('chat');
  let h = '';
  (butuh || []).forEach(b => {
    h += `<div class="kartu-butuh">🙋 <b>${esc(b.untuk)}</b> butuh bantuanmu:<br>${esc(b.pesan)}
      <input id="butuh-${b.id}" placeholder="Tulis jawaban (OTP/kode)...">
      <div class="row"><button class="kb-kirim" onclick="jawabButuh('${b.id}')">Kirim</button>
      <button class="kb-browser" onclick="bukaBrowser('${b.id}')">🖥️ Browser</button></div></div>`;
  });
  (log || []).forEach(m => {
    h += `<div class="msg ${m.dari === 'user' ? 'user' : ''}">
          <div class="dari">${m.dari === 'user' ? '🧑 Kamu' : '🤖 Komandan'} · ${esc(m.pada || '')}</div>
          ${esc(m.teks)}</div>`;
  });
  el.innerHTML = h;
  el.scrollTop = el.scrollHeight;
  BUTUH_N = (butuh || []).length;
  const bar = document.getElementById('chatbar');
  bar.classList.toggle('ada-butuh', BUTUH_N > 0);
  document.getElementById('cbadge').textContent = BUTUH_N + ' butuh bantuan';
}
async function muatChat() {
  try { const d = await api('/api/chat'); gambarChat(d.chat, d.butuh); } catch(e) {}
}
async function jawabButuh(id) {
  const v = document.getElementById('butuh-' + id).value.trim();
  if (!v) return alert('Tulis jawabannya dulu.');
  await api('/api/aksi', 'POST', { aksi: 'beri', id, isi: v });
  muatChat(); muatStatus();
}
document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const inp = document.getElementById('chat-input');
  const v = inp.value.trim(); if (!v) return;
  inp.value = '';
  await api('/api/chat', 'POST', { teks: v });
  muatChat(); muatStatus();
});

/* ---------- tugas baru ---------- */
document.getElementById('b-tugas').addEventListener('click', async () => {
  const judul = document.getElementById('f-judul').value.trim();
  if (!judul) return alert('Tulis judul tugas dulu.');
  const body = { judul, prioritas: document.getElementById('f-prioritas').value };
  const u = document.getElementById('f-untuk').value;
  if (u) body.untuk = u;
  const d = await api('/api/tugas', 'POST', body);
  document.getElementById('f-judul').value = '';
  tutupSheets();
  alert(d.ok ? `Tugas dibuat untuk ${d.untuk} ✅` : ('Gagal: ' + (d.error || d.keluaran)));
  muatStatus();
});

/* ---------- browser tim ---------- */
let B_TIMER = null, B_TUGAS_ID = null;
async function bukaBrowser(taskId) {
  B_TUGAS_ID = taskId || null;
  document.getElementById('browser-view').style.display = 'flex';
  tutupSheets();
  bStatus();
  const img = document.getElementById('b-layar');
  const segarkan = () => { img.src = '/api/browser/layar?t=' + Date.now(); };
  segarkan();
  clearInterval(B_TIMER);
  B_TIMER = setInterval(segarkan, 1500);
}
function tutupBrowser() {
  clearInterval(B_TIMER);
  document.getElementById('browser-view').style.display = 'none';
}
async function bStatus() {
  try {
    const d = await api('/api/browser/status');
    document.getElementById('b-status').textContent = d.url ? ('🌐 ' + d.url) : 'browser siap';
    if (d.url) document.getElementById('b-url').value = d.url;
  } catch(e) { document.getElementById('b-status').textContent = '⚠️ gagal terhubung'; }
}
async function bAksi(aksi, arg) {
  const body = { aksi };
  if (aksi === 'buka') {
    const u = document.getElementById('b-url').value.trim();
    if (!u) return alert('Tulis URL dulu.');
    body.url = u;
  } else if (aksi === 'ketik') {
    const v = document.getElementById('b-ketik').value;
    if (!v) return alert('Tulis teks dulu.');
    body.teks = v;
    document.getElementById('b-ketik').value = '';
  } else if (aksi === 'tombol') body.tombol = arg;
  const d = await api('/api/browser/aksi', 'POST', body);
  if (d.error) alert(d.error);
  bStatus();
}
document.getElementById('b-layar').addEventListener('click', async (e) => {
  const r = e.target.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  await api('/api/browser/aksi', 'POST', { aksi: 'klik_xy', x, y });
});
async function bSelesai() {
  let bid = B_TUGAS_ID;
  if (!bid) {
    const d = await api('/api/chat');
    const b = (d.butuh || [])[0];
    bid = b ? b.id : null;
  }
  if (!bid) { tutupBrowser(); return; }
  const v = prompt('Catatan untuk agen (mis. "OTP sudah diisi, lanjutkan"):');
  if (v === null) return;
  await api('/api/aksi', 'POST', { aksi: 'beri', id: bid, isi: v || 'selesai via browser' });
  B_TUGAS_ID = null;
  tutupBrowser(); muatChat(); muatStatus();
}

/* ---------- loop ---------- */
muatStatus(); muatChat();
setInterval(muatStatus, 3000);
setInterval(muatChat, 3000);
</script>
</body>
</html>
